# Mission Control behind nginx with basic auth + TLS. The API stays on loopback;
# only the dashboard is exposed. Generate credentials: htpasswd -c /etc/nginx/.htpasswd operator
server {
  listen 443 ssl http2;
  server_name trader.example.com;
  ssl_certificate     /etc/letsencrypt/live/trader.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trader.example.com/privkey.pem;

  auth_basic "Mission Control";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
