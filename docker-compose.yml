services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: claude_trader
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d claude_trader"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  api:
    build: .
    command: ["node", "apps/api/dist/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:trader@postgres:5432/claude_trader
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      EXECUTOR_URL: http://executor:4200
      REPO_ROOT: /app
    ports: ["127.0.0.1:4100:4100"]
    volumes: [./runtime:/app/runtime, ./reports:/app/reports, ./data:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:trader@postgres:5432/claude_trader
      REDIS_URL: redis://redis:6379
      REPO_ROOT: /app
    volumes: [./runtime:/app/runtime, ./reports:/app/reports, ./data:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  executor:
    build: .
    command: ["node", "apps/executor/dist/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:trader@postgres:5432/claude_trader
      REPO_ROOT: /app
      EXECUTOR_HOST: 0.0.0.0
    volumes: [./runtime:/app/runtime, ./data:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build: .
    command: ["node", "apps/dashboard/.next/standalone/apps/dashboard/server.js"]
    environment:
      API_URL: http://api:4100
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
